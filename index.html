<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9ed8ef">
    <title>Lucas's House</title>
    <style>
      :root { font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; color: #26384a; background: #9ed8ef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: linear-gradient(#9ed8ef 0 65%, #8dcc79 65%); }
      body::before { position: fixed; top: 7%; left: 8%; width: 90px; height: 90px; border-radius: 50%; background: #ffe36e; box-shadow: 0 0 0 18px #ffe36e33; content: ""; }
      main { position: relative; z-index: 1; width: min(980px, calc(100% - 28px)); margin: 0 auto; padding: 52px 0 36px; text-align: center; }
      .eyebrow { margin: 0 0 8px; color: #31556a; font-size: .8rem; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.7rem, 8vw, 5.8rem); line-height: 1; letter-spacing: -.055em; }
      .intro { max-width: 600px; margin: 16px auto 34px; color: #3f5d6e; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.5; }
      .house { position: relative; width: min(780px, 100%); margin: 90px auto 0; padding: 80px 48px 44px; border: 4px solid #26384a; border-radius: 8px 8px 18px 18px; background: #fff4d1; box-shadow: 12px 14px 0 #26384a; }
      .house::before { position: absolute; z-index: -1; top: -106px; left: 50%; width: 72%; aspect-ratio: 2 / 1; border: 4px solid #26384a; background: #eb6c55; content: ""; transform: translateX(-50%) rotate(45deg); }
      .house::after { position: absolute; top: 25px; left: 50%; width: 94px; height: 42px; border: 3px solid #26384a; border-radius: 8px; background: #fff; content: "LUCAS'S HOUSE"; font-size: .64rem; font-weight: 900; line-height: 42px; letter-spacing: .06em; transform: translateX(-50%); }
      .doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(22px, 6vw, 62px); }
      .door { position: relative; display: grid; min-height: 260px; padding: 38px 20px 24px; border: 4px solid #26384a; border-radius: 120px 120px 8px 8px; color: #26384a; background: #73d6c2; place-content: center; text-decoration: none; box-shadow: inset -12px 0 #00000010; transition: transform 160ms ease, filter 160ms ease; }
      .door:nth-child(2) { background: #f3a5c4; }
      .door::after { position: absolute; right: 18px; top: 56%; width: 14px; height: 14px; border: 3px solid #26384a; border-radius: 50%; background: #ffe36e; content: ""; }
      .door:hover { filter: brightness(1.04); transform: translateY(-5px); }
      .door:focus-visible { outline: 6px solid #fff; outline-offset: 5px; }
      .icon { display: block; margin-bottom: 12px; font-size: 3rem; }
      .door strong { display: block; font-size: clamp(1.45rem, 4vw, 2.15rem); }
      .door span:last-child { margin-top: 8px; font-size: .92rem; font-weight: 700; }
      footer { margin-top: 34px; color: #31556a; font-size: .9rem; }
      @media (max-width: 580px) {
        main { padding-top: 38px; }
        .house { margin-top: 72px; padding: 72px 22px 30px; box-shadow: 7px 9px 0 #26384a; }
        .house::before { top: -78px; }
        .doors { gap: 14px; }
        .door { min-height: 210px; padding-inline: 10px; }
        .door::after { right: 9px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Welcome home</p>
      <h1>Lucas's House</h1>
      <p class="intro">Come inside and explore. Each room holds a different collection of things Lucas makes.</p>
      <section class="house" aria-label="Choose a room">
        <div class="doors">
          <a class="door" href="games/">
            <span class="icon" aria-hidden="true">🎮</span>
            <strong>Games Room</strong>
            <span>Play and explore</span>
          </a>
          <a class="door" href="build-box/">
            <span class="icon" aria-hidden="true">🧰</span>
            <strong>Build Box</strong>
            <span>See what Lucas built</span>
          </a>
        </div>
      </section>
      <footer>Made by Lucas.</footer>
    </main>
  </body>
</html>
