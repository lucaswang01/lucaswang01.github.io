<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f0a9c5">
    <title>Disc Launcher · Build Box</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
        color: #3f2e29;
        background: #f7e8d5;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 88% 12%, #f0a9c5 0 9%, transparent 9.2%),
          linear-gradient(145deg, #fffaf0, #efd4b4);
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 72px;
      }

      .back {
        display: inline-block;
        margin-bottom: 54px;
        color: inherit;
        font-weight: 900;
        text-decoration: none;
      }

      .back:hover { text-decoration: underline; }

      .eyebrow {
        margin: 0 0 8px;
        color: #a34770;
        font-size: .8rem;
        font-weight: 900;
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 850px;
        margin: 0;
        font-size: clamp(3.2rem, 10vw, 7rem);
        line-height: .95;
        letter-spacing: -.06em;
      }

      .description {
        max-width: 700px;
        margin: 22px 0 46px;
        color: #705b52;
        font-size: clamp(1.1rem, 2.5vw, 1.35rem);
        line-height: 1.6;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 4px solid #3f2e29;
        border-radius: 24px;
        background: #fff8df;
        box-shadow: 9px 10px 0 #3f2e29;
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      figcaption {
        padding: 16px 20px;
        border-top: 4px solid #3f2e29;
        font-size: 1.05rem;
        font-weight: 900;
      }

      figure:first-child figcaption { background: #f0a9c5; }
      figure:last-child figcaption { background: #87d9c6; }

      @media (max-width: 720px) {
        .back { margin-bottom: 38px; }
        .gallery { grid-template-columns: 1fr; }
        figure { box-shadow: 6px 7px 0 #3f2e29; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Back to the bookshelf</a>
      <p class="eyebrow">Build Box #1</p>
      <h1>Disc Launcher</h1>
      <p class="description">These pictures show the top and bottom of the disc launcher.</p>

      <section class="gallery" aria-label="Disc Launcher photos">
        <figure>
          <img src="images/disc-launcher-top.jpg" alt="Top of Lucas's wooden disc launcher, showing its blue wheel, yellow launch track, and lever" width="1800" height="1350">
          <figcaption>Top view</figcaption>
        </figure>
        <figure>
          <img src="images/disc-launcher-bottom.jpg" alt="Bottom of Lucas's wooden disc launcher, showing its battery pack, motor, wires, and elastic mechanism" width="1800" height="1350">
          <figcaption>Bottom view</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
