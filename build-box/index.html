<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9b98f">
    <title>Build Box · Lucas's House</title>
    <style>
      :root { font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; color: #3f2e29; background: #f3dfc4; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: linear-gradient(#f6e8d5 0 76%, #c98255 76%); }
      main { width: min(1020px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 70px; }
      .back { display: inline-block; margin-bottom: 48px; color: inherit; font-weight: 900; text-decoration: none; }
      .back:hover { text-decoration: underline; }
      .eyebrow { margin: 0 0 8px; color: #9c4d46; font-size: .8rem; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3rem, 9vw, 6rem); line-height: 1; letter-spacing: -.055em; }
      .intro { max-width: 650px; margin: 18px 0 46px; color: #755e55; font-size: 1.12rem; line-height: 1.55; }
      .bookcase { padding: 30px 26px 0; border: 8px solid #603f2d; border-radius: 12px 12px 4px 4px; background: #a96c43; box-shadow: 12px 14px 0 #3f2e29; }
      .shelf { display: flex; min-height: 285px; align-items: flex-end; gap: 14px; padding: 24px 20px 0; border-bottom: 18px solid #603f2d; background: #744831; box-shadow: inset 0 14px #0002; }
      .book { display: grid; width: clamp(90px, 16vw, 140px); height: 220px; padding: 18px 12px; border: 4px solid #3f2e29; border-radius: 7px 10px 4px 4px; color: #3f2e29; background: #f0a9c5; place-items: center; text-align: center; text-decoration: none; box-shadow: inset -8px 0 #00000012; transform-origin: bottom; transition: transform 160ms ease; }
      .book:nth-child(2) { height: 190px; background: #87d9c6; }
      .book:nth-child(3) { height: 205px; background: #f5d36b; }
      .book:hover { transform: translateY(-10px) rotate(-2deg); }
      .book:focus-visible { outline: 6px solid #fff; outline-offset: 5px; }
      .book strong { font-size: 1.08rem; line-height: 1.15; writing-mode: vertical-rl; transform: rotate(180deg); }
      .book.placeholder { border-style: dashed; opacity: .72; cursor: default; }
      .note { margin: 30px 0 0; padding: 18px 22px; border: 3px solid #3f2e29; border-radius: 14px; background: #fff8df; font-size: .96rem; line-height: 1.5; }
      @media (max-width: 520px) { .bookcase { padding-inline: 12px; box-shadow: 7px 9px 0 #3f2e29; } .shelf { gap: 8px; padding-inline: 10px; } .book { min-width: 74px; padding-inline: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Back to the entrance</a>
      <p class="eyebrow">Room two</p>
      <h1>Build Box</h1>
      <p class="intro">Each book on this shelf will open one of Lucas's builds, with photos and a story about how it was made.</p>
      <section class="bookcase" aria-label="Build Box bookshelf">
        <div class="shelf">
          <a class="book" href="disc-launcher/" aria-label="Open the Disc Launcher build">
            <strong>Disc Launcher</strong>
          </a>
          <div class="book placeholder"><strong>Future Build</strong></div>
          <div class="book placeholder"><strong>Future Build</strong></div>
        </div>
      </section>
      <p class="note"><strong>Pick a book.</strong> Open the Disc Launcher to see Lucas's first build from the top and bottom.</p>
    </main>
  </body>
</html>
