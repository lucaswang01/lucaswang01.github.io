<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8e7">
    <title>Lucas's Homepage</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
        color: #18324a;
        background: #fff8e7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 18%, #ffe279 0 8%, transparent 8.2%),
          radial-gradient(circle at 88% 82%, #8fe3d3 0 12%, transparent 12.2%),
          linear-gradient(145deg, #fffdf5, #fff0ca);
      }

      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(72px, 12vw, 140px) 0 64px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #ee704a;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(2.8rem, 8vw, 6.4rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 560px;
        margin: 24px 0 52px;
        color: #536779;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.6;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 24px;
      }

      .game-card {
        position: relative;
        display: block;
        min-height: 260px;
        overflow: hidden;
        padding: 30px;
        border: 3px solid #18324a;
        border-radius: 28px;
        color: inherit;
        background: #74d9e7;
        box-shadow: 8px 8px 0 #18324a;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .game-card::after {
        position: absolute;
        right: -32px;
        bottom: -54px;
        width: 190px;
        height: 190px;
        border: 3px solid #18324a;
        border-radius: 50%;
        background: #ffdc55;
        content: "";
      }

      .game-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 11px 11px 0 #18324a;
      }

      .game-card:active {
        transform: translate(3px, 3px);
        box-shadow: 5px 5px 0 #18324a;
      }

      .game-card:focus-visible {
        outline: 5px solid #ee704a;
        outline-offset: 6px;
      }

      .game-card h2 {
        position: relative;
        z-index: 1;
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.2rem);
        letter-spacing: -0.04em;
      }

      .game-card p {
        position: relative;
        z-index: 1;
        max-width: 390px;
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .play {
        position: absolute;
        z-index: 1;
        right: 28px;
        bottom: 25px;
        font-size: 1.1rem;
        font-weight: 900;
      }

      footer {
        margin-top: 54px;
        color: #6b7985;
        font-size: 0.9rem;
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 28px, 960px);
          padding-top: 64px;
        }

        .game-card {
          min-height: 240px;
          padding: 24px;
          box-shadow: 6px 6px 0 #18324a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Welcome</p>
      <h1>Lucas's Homepage</h1>
      <p class="intro">A little corner of the internet for Lucas's games, projects, and creative experiments.</p>

      <section class="games" aria-label="Lucas's games">
        <a class="game-card" href="flappy-bird/">
          <h2>Flappy Bird</h2>
          <p>Flap through the pipes, collect points, and try to beat your best score.</p>
          <span class="play">Play now →</span>
        </a>
      </section>

      <footer>Made by Lucas.</footer>
    </main>
  </body>
</html>
