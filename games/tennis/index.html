<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#b8df72">
    <title>Lucas Tennis · Games Room</title>
    <style>
      :root { font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; color: #fff; background: #347c55; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; background: #347c55; place-items: center; }
      main { width: min(820px, 100%); }
      .back { display: inline-block; margin-bottom: 24px; color: #fff; font-weight: 900; text-decoration: none; }
      .court { position: relative; display: grid; min-height: 520px; padding: 36px; border: 6px solid #fff; background: #4a9e6b; place-items: center; text-align: center; box-shadow: 12px 12px 0 #173e2a; }
      .court::before, .court::after { position: absolute; background: #fff; content: ""; }
      .court::before { top: 50%; left: 0; width: 100%; height: 6px; }
      .court::after { top: 0; left: 50%; width: 6px; height: 100%; }
      .placeholder { position: relative; z-index: 1; max-width: 520px; padding: 34px; border: 4px solid #203e30; border-radius: 24px; color: #26384a; background: #fff8d8; box-shadow: 8px 8px 0 #203e30; }
      .ball { display: block; margin-bottom: 14px; font-size: 4rem; }
      h1 { margin: 0 0 12px; font-size: clamp(2.8rem, 9vw, 5rem); line-height: 1; letter-spacing: -.05em; }
      p { margin: 0; color: #53645b; font-size: 1.1rem; line-height: 1.55; }
      @media (max-width: 520px) { body { padding: 14px; } .court { min-height: 450px; padding: 18px; } .placeholder { padding: 26px 20px; } }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Back to the Games Room</a>
      <section class="court">
        <div class="placeholder">
          <span class="ball" aria-hidden="true">🎾</span>
          <h1>Lucas Tennis</h1>
          <p>The court is ready. The tennis game will be built here next.</p>
        </div>
      </section>
    </main>
  </body>
</html>
