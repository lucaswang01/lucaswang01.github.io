<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6b5d1">
    <title>Typing Game · Lucas's Homepage</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
        color: #20344a;
        background: #fff7e8;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(circle at 15% 18%, #ffe06b 0 7%, transparent 7.2%),
          radial-gradient(circle at 88% 82%, #92e3d1 0 10%, transparent 10.2%),
          linear-gradient(145deg, #fffdf7, #ffe5ee);
      }

      main {
        width: min(760px, 100%);
      }

      .back {
        display: inline-block;
        margin-bottom: 20px;
        color: inherit;
        font-weight: 900;
        text-decoration: none;
      }

      .back:hover { text-decoration: underline; }

      .game {
        padding: clamp(24px, 6vw, 52px);
        border: 3px solid #20344a;
        border-radius: 30px;
        background: #fffdf9;
        box-shadow: 10px 10px 0 #20344a;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.4rem, 8vw, 4.6rem);
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .instructions {
        margin: 0 0 30px;
        color: #637181;
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 22px;
      }

      .stat {
        padding: 14px;
        border: 2px solid #20344a;
        border-radius: 16px;
        background: #f6b5d1;
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: clamp(1.4rem, 5vw, 2rem);
      }

      .stat span {
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .words {
        min-height: 150px;
        margin: 0 0 20px;
        padding: 22px;
        border: 2px solid #20344a;
        border-radius: 18px;
        background: #fff4b8;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        line-height: 1.8;
      }

      .word { color: #73808a; }
      .word.current {
        padding: 2px 5px;
        border-radius: 6px;
        color: #20344a;
        background: #fff;
        box-shadow: inset 0 -3px #f0729e;
      }
      .word.correct { color: #2b8a65; }
      .word.wrong { color: #ce3f51; text-decoration: underline; }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 900;
      }

      input {
        width: 100%;
        padding: 16px 18px;
        border: 3px solid #20344a;
        border-radius: 15px;
        color: inherit;
        background: #fff;
        font: 700 1.15rem inherit;
        outline: none;
      }

      input:focus { box-shadow: 0 0 0 5px #92e3d188; }
      input:disabled { cursor: not-allowed; background: #e9e5df; }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
      }

      #message {
        margin: 0;
        font-weight: 800;
      }

      button {
        flex: none;
        padding: 12px 18px;
        border: 2px solid #20344a;
        border-radius: 999px;
        color: inherit;
        background: #92e3d1;
        box-shadow: 3px 3px 0 #20344a;
        font: 900 1rem inherit;
        cursor: pointer;
      }

      button:hover { transform: translate(-1px, -1px); }
      button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #20344a; }
      button:focus-visible { outline: 4px solid #f0729e; outline-offset: 4px; }

      @media (max-width: 520px) {
        body { padding: 16px; }
        .game { box-shadow: 6px 6px 0 #20344a; }
        .words { min-height: 180px; }
        .actions { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Lucas's Homepage</a>
      <section class="game" aria-labelledby="title">
        <h1 id="title">Typing Game</h1>
        <p class="instructions">Type each highlighted word and press space. You have 30 seconds!</p>

        <div class="stats" aria-label="Game statistics">
          <div class="stat"><strong id="time">30</strong><span>Seconds</span></div>
          <div class="stat"><strong id="wpm">0</strong><span>WPM</span></div>
          <div class="stat"><strong id="accuracy">100%</strong><span>Accuracy</span></div>
        </div>

        <p class="words" id="words" aria-live="polite"></p>
        <label for="input">Type here</label>
        <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Start typing…">

        <div class="actions">
          <p id="message" aria-live="polite">The timer starts with your first letter.</p>
          <button id="restart" type="button">New game</button>
        </div>
      </section>
    </main>

    <script>
      (() => {
        'use strict';

        const wordBank = [
          'apple', 'bird', 'blue', 'brave', 'bright', 'cloud', 'dance', 'dream',
          'fast', 'friend', 'game', 'green', 'happy', 'jump', 'kind', 'laugh',
          'light', 'magic', 'music', 'ocean', 'play', 'quick', 'rainbow', 'rocket',
          'smile', 'space', 'star', 'sunny', 'tiger', 'world'
        ];
        const wordsEl = document.querySelector('#words');
        const input = document.querySelector('#input');
        const timeEl = document.querySelector('#time');
        const wpmEl = document.querySelector('#wpm');
        const accuracyEl = document.querySelector('#accuracy');
        const message = document.querySelector('#message');
        const restart = document.querySelector('#restart');

        let words = [];
        let current = 0;
        let correct = 0;
        let attempted = 0;
        let seconds = 30;
        let timer = null;
        let startedAt = 0;

        function makeWords() {
          return Array.from({ length: 24 }, () => wordBank[Math.floor(Math.random() * wordBank.length)]);
        }

        function renderWords() {
          wordsEl.replaceChildren(...words.map((word, index) => {
            const span = document.createElement('span');
            span.className = `word${index === current ? ' current' : ''}`;
            span.textContent = `${word} `;
            return span;
          }));
        }

        function updateStats() {
          const elapsedMinutes = startedAt ? Math.max((Date.now() - startedAt) / 60000, 1 / 60) : 0;
          wpmEl.textContent = elapsedMinutes ? Math.round(correct / elapsedMinutes) : '0';
          accuracyEl.textContent = attempted ? `${Math.round(correct / attempted * 100)}%` : '100%';
          timeEl.textContent = seconds;
        }

        function startTimer() {
          if (timer) return;
          startedAt = Date.now();
          message.textContent = 'Keep going!';
          timer = window.setInterval(() => {
            seconds -= 1;
            updateStats();
            if (seconds <= 0) finish();
          }, 1000);
        }

        function finish() {
          window.clearInterval(timer);
          timer = null;
          input.disabled = true;
          updateStats();
          message.textContent = `Time! You typed ${correct} correct ${correct === 1 ? 'word' : 'words'}.`;
        }

        function checkWord() {
          const typed = input.value.trim();
          if (!typed) return;

          attempted += 1;
          const spans = wordsEl.querySelectorAll('.word');
          const isCorrect = typed === words[current];
          spans[current].classList.remove('current');
          spans[current].classList.add(isCorrect ? 'correct' : 'wrong');
          if (isCorrect) correct += 1;
          current += 1;
          input.value = '';

          if (current === words.length) {
            words = makeWords();
            current = 0;
            renderWords();
          } else {
            spans[current].classList.add('current');
          }
          updateStats();
        }

        function reset() {
          window.clearInterval(timer);
          timer = null;
          words = makeWords();
          current = 0;
          correct = 0;
          attempted = 0;
          seconds = 30;
          startedAt = 0;
          input.value = '';
          input.disabled = false;
          message.textContent = 'The timer starts with your first letter.';
          renderWords();
          updateStats();
          input.focus();
        }

        input.addEventListener('input', startTimer);
        input.addEventListener('keydown', event => {
          if (event.key === ' ') {
            event.preventDefault();
            checkWord();
          }
        });
        restart.addEventListener('click', reset);
        reset();
      })();
    </script>
  </body>
</html>
