<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#67d5e7">
  <title>Flappy Bird</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 10%,#fff9 0,transparent 36rem),linear-gradient(145deg,#b7f3ef,#55bfd8);font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;touch-action:manipulation;user-select:none}.game{position:relative;width:min(100%,470px);height:min(calc(100dvh - 24px),760px);min-height:520px;overflow:hidden;border:4px solid #ffffff99;border-radius:28px;box-shadow:0 28px 80px #17353c47,inset 0 0 0 2px #17353c24;background:#70d7e6}canvas{display:block;width:100%;height:100%;cursor:pointer}.hud{position:absolute;z-index:2;inset:18px 18px auto;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.best{padding:8px 12px;border:2px solid #17353c24;border-radius:99px;color:#fff;background:#17353c33;font-size:12px;font-weight:900;letter-spacing:.08em;text-shadow:0 2px #17353c47;backdrop-filter:blur(8px)}button{width:42px;height:42px;border:2px solid #17353c33;border-radius:50%;color:#fff;background:#17353c33;box-shadow:0 3px #17353c24;font:900 16px inherit;cursor:pointer;pointer-events:auto}button:hover{background:#17353c55}button:active{transform:translateY(2px)}button:focus-visible{outline:4px solid #fffc;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){body{padding:0}.game{width:100%;height:100dvh;min-height:480px;border:0;border-radius:0}.hud{inset:max(14px,env(safe-area-inset-top)) 14px auto}}
  </style>
</head>
<body>
  <main class="game" aria-label="Flappy Bird game">
    <canvas id="canvas" width="480" height="760" aria-label="Press space, click, or tap to flap"></canvas>
    <div class="hud"><div class="best">BEST <span id="best">0</span></div><button id="pause" aria-label="Pause game" title="Pause (P)">Ⅱ</button></div>
    <p id="status" class="sr" aria-live="polite">Press space or click to start.</p>
  </main>
  <script>
  (()=>{
    'use strict';
    const c=document.querySelector('#canvas'),x=c.getContext('2d'),bestEl=document.querySelector('#best'),pauseBtn=document.querySelector('#pause'),status=document.querySelector('#status');
    const W=480,H=760,FLOOR=650,PW=76,GAP=174,SPEED=168,GRAVITY=1280,JUMP=-410;
    let mode='ready',score=0,best=Number(localStorage.getItem('flappy-best')||0),last=performance.now(),time=0,spawn=.4,ground=0,flash=0,shake=0,pipes=[],dust=[],audio;
    const bird={x:122,y:325,vy:0,rot:0}; bestEl.textContent=best;

    function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
    function label(s,a,b,size,color='#fff',align='center'){
      x.save();x.font=`900 ${size}px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",sans-serif`;x.textAlign=align;x.textBaseline='middle';x.lineJoin='round';x.lineWidth=Math.max(3,size*.12);x.strokeStyle='#31525a';x.strokeText(s,a,b);x.fillStyle=color;x.fillText(s,a,b);x.restore()
    }
    function beep(kind){
      try{audio??=new(window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),s={flap:[480,680,.07,'sine'],point:[760,1080,.1,'square'],hit:[150,60,.22,'sawtooth']}[kind];o.connect(g);g.connect(audio.destination);o.type=s[3];o.frequency.setValueAtTime(s[0],now);o.frequency.exponentialRampToValueAtTime(s[1],now+s[2]);g.gain.setValueAtTime(.055,now);g.gain.exponentialRampToValueAtTime(.001,now+s[2]);o.start();o.stop(now+s[2])}catch(e){}
    }
    function reset(){mode='ready';score=0;spawn=.45;pipes=[];dust=[];bird.y=325;bird.vy=0;bird.rot=0;pauseBtn.textContent='Ⅱ';pauseBtn.ariaLabel='Pause game';status.textContent='Press space or click to start.'}
    function flap(){if(mode!=='playing')return;bird.vy=JUMP;bird.rot=-.42;beep('flap');for(let i=0;i<4;i++)dust.push({x:bird.x-18,y:bird.y+(Math.random()-.5)*14,vx:-60-Math.random()*80,vy:(Math.random()-.5)*80,life:.35+Math.random()*.2,r:3+Math.random()*4})}
    function action(e){e?.preventDefault();if(mode==='paused')return;if(mode==='gameover')reset();if(mode==='ready'){mode='playing';status.textContent='Game started. Score 0.'}flap()}
    function pause(){if(mode==='playing'){mode='paused';pauseBtn.textContent='▶';pauseBtn.ariaLabel='Resume game';status.textContent='Game paused.'}else if(mode==='paused'){mode='playing';pauseBtn.textContent='Ⅱ';pauseBtn.ariaLabel='Pause game';last=performance.now();status.textContent='Game resumed.'}}
    function die(){if(mode!=='playing')return;mode='gameover';shake=12;flash=.75;beep('hit');if(score>best){best=score;localStorage.setItem('flappy-best',best);bestEl.textContent=best}status.textContent=`Game over. Score ${score}. Best ${best}. Press space or click to play again.`}
    function addPipe(){const m=105,g=m+GAP/2+Math.random()*(FLOOR-m*2-GAP);pipes.push({x:W+20,g,done:false})}
    function hit(p){const inX=bird.x+17>p.x&&bird.x-17<p.x+PW,badY=bird.y-14<p.g-GAP/2||bird.y+14>p.g+GAP/2;return inX&&badY}
    function update(dt){
      time+=dt;flash=Math.max(0,flash-dt*3);shake=Math.max(0,shake-dt*35);dust.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});dust=dust.filter(p=>p.life>0);
      if(mode==='ready'){bird.y=325+Math.sin(time*4)*8;bird.rot=Math.sin(time*4)*.06;ground=(ground+SPEED*.42*dt)%48;return}if(mode!=='playing')return;
      ground=(ground+SPEED*dt)%48;bird.vy+=GRAVITY*dt;bird.y+=bird.vy*dt;bird.rot=Math.min(1.35,bird.rot+2.15*dt);spawn-=dt;if(spawn<=0){addPipe();spawn=1.5}
      pipes.forEach(p=>{p.x-=SPEED*dt;if(!p.done&&p.x+PW<bird.x){p.done=true;score++;beep('point');status.textContent=`Score ${score}.`}if(hit(p))die()});pipes=pipes.filter(p=>p.x+PW>-10);
      if(bird.y+17>=FLOOR||bird.y-17<=0){bird.y=Math.min(FLOOR-17,Math.max(17,bird.y));die()}
    }
    function cloud(a,b,s,alpha=.65){x.save();x.globalAlpha=alpha;x.fillStyle='#fff';x.beginPath();x.arc(a,b,20*s,Math.PI,0);x.arc(a+23*s,b-11*s,28*s,Math.PI,0);x.arc(a+53*s,b,19*s,Math.PI,0);x.lineTo(a+72*s,b+17*s);x.lineTo(a-20*s,b+17*s);x.closePath();x.fill();x.restore()}
    function background(){
      const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#68d5e8');g.addColorStop(.72,'#b9eef0');g.addColorStop(1,'#f3f5c6');x.fillStyle=g;x.fillRect(0,0,W,H);cloud(42-(time*8)%590,140,.92);cloud(325-(time*5)%650,260,.65,.5);cloud(450-(time*8)%590,140,.92);
      x.fillStyle='#8dd4b0';x.beginPath();x.moveTo(0,FLOOR);for(let a=-40;a<=W+80;a+=70){let h=42+Math.sin(a*.035)*17;x.quadraticCurveTo(a+35,FLOOR-h-20,a+70,FLOOR-h)}x.lineTo(W,FLOOR);x.closePath();x.fill();x.fillStyle='#ffffff8c';for(let a=16;a<W;a+=31)x.fillRect(a,FLOOR-18-(a%71),12,18+(a%25))
    }
    function drawPipe(p){
      const top=p.g-GAP/2,bot=p.g+GAP/2,g=x.createLinearGradient(p.x,0,p.x+PW,0);g.addColorStop(0,'#3b873d');g.addColorStop(.16,'#8bd94e');g.addColorStop(.5,'#baf260');g.addColorStop(.82,'#64b840');g.addColorStop(1,'#276b39');x.save();x.fillStyle=g;x.strokeStyle='#245d38';x.lineWidth=4;x.beginPath();x.rect(p.x+7,-6,PW-14,top-24);x.fill();x.stroke();rr(p.x-5,top-28,PW+10,30,4);x.fill();x.stroke();x.beginPath();x.rect(p.x+7,bot+24,PW-14,FLOOR-bot-20);x.fill();x.stroke();rr(p.x-5,bot,PW+10,30,4);x.fill();x.stroke();x.globalAlpha=.5;x.fillStyle='#e9ff9e';x.fillRect(p.x+14,0,8,Math.max(0,top-29));x.fillRect(p.x+14,bot+30,8,Math.max(0,FLOOR-bot-30));x.restore()
    }
    function floor(){
      x.fillStyle='#8acb45';x.fillRect(0,FLOOR,W,16);x.fillStyle='#dff16b';x.fillRect(0,FLOOR+5,W,9);x.fillStyle='#fff5bd';x.fillRect(0,FLOOR+16,W,H-FLOOR-16);x.save();x.beginPath();x.rect(0,FLOOR,W,19);x.clip();x.strokeStyle='#62a843';x.lineWidth=8;for(let a=-52-ground;a<W+52;a+=48){x.beginPath();x.moveTo(a,FLOOR+18);x.lineTo(a+22,FLOOR);x.stroke()}x.restore();x.fillStyle='#e7d58d';x.fillRect(0,FLOOR+44,W,5);x.fillStyle='#c49f4e38';for(let a=12;a<W;a+=37){x.beginPath();x.arc(a,FLOOR+72+a%14,2,0,Math.PI*2);x.fill()}
    }
    function drawBird(){
      x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);const wing=mode==='playing'?Math.sin(time*25):Math.sin(time*7);x.save();x.translate(-14,6);x.rotate(wing*.24);x.fillStyle='#f1a62d';x.strokeStyle='#7d511f';x.lineWidth=3;x.beginPath();x.ellipse(0,0,17,10,-.25,0,Math.PI*2);x.fill();x.stroke();x.restore();x.fillStyle='#ffdf3f';x.strokeStyle='#6e4b27';x.lineWidth=3.5;x.beginPath();x.ellipse(0,0,24,20,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.ellipse(10,-8,10,12,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#21383b';x.beginPath();x.arc(14,-7,3.5,0,Math.PI*2);x.fill();x.fillStyle='#f26b38';x.beginPath();x.moveTo(18,2);x.lineTo(37,7);x.lineTo(18,13);x.closePath();x.fill();x.stroke();x.restore()
    }
    function panel(a,b,w,h){x.save();x.shadowColor='#17353c47';x.shadowOffsetY=7;x.fillStyle='#fff6cb';x.strokeStyle='#31525a';x.lineWidth=4;rr(a,b,w,h,18);x.fill();x.stroke();x.restore()}
    function overlay(){
      if(mode==='playing'){label(String(score),W/2,84,52);return}
      if(mode==='ready'){label('FLAPPY',W/2,126,58);label('BIRD',W/2,180,64,'#ffdc3f');panel(90,475,300,104);label('CLICK  •  TAP  •  SPACE',W/2,507,17,'#f08032');x.fillStyle='#31525a';x.font='800 15px ui-rounded,sans-serif';x.textAlign='center';x.fillText('Fly through the pipes',W/2,551);return}
      if(mode==='paused'){x.fillStyle='#1e414646';x.fillRect(0,0,W,H);panel(90,280,300,142);label('PAUSED',W/2,327,35,'#f08032');x.fillStyle='#31525a';x.font='800 15px ui-rounded,sans-serif';x.textAlign='center';x.fillText('Press P to keep flying',W/2,380);return}
      label('GAME OVER',W/2,165,43);panel(76,225,328,220);x.fillStyle='#64757a';x.font='900 15px ui-rounded,sans-serif';x.textAlign='left';x.fillText('SCORE',112,273);x.fillText('BEST',112,342);label(String(score),365,280,31,'#f08032','right');label(String(best),365,349,31,'#f08032','right');if(score>0&&score===best){x.fillStyle='#72bf45';rr(271,389,93,28,99);x.fill();x.fillStyle='#fff';x.font='900 12px ui-rounded,sans-serif';x.textAlign='center';x.fillText('NEW BEST!',318,408)}panel(112,484,256,72);label('PLAY AGAIN',W/2,520,22,'#f08032')
    }
    function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();pipes.forEach(drawPipe);floor();dust.forEach(p=>{x.globalAlpha=Math.min(1,p.life*3);x.fillStyle='#fff4a5';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()});x.globalAlpha=1;drawBird();overlay();if(flash){x.globalAlpha=flash;x.fillStyle='#fff';x.fillRect(0,0,W,H)}x.restore()}
    function frame(now){const dt=Math.min((now-last)/1000,.032);last=now;update(dt);draw();requestAnimationFrame(frame)}
    c.addEventListener('pointerdown',action);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')action(e);if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();pause()}if(e.code==='KeyR'){e.preventDefault();reset();action()}});pauseBtn.addEventListener('click',e=>{e.stopPropagation();pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});reset();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
