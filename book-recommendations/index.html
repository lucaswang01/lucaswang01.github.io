<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd978">
    <title>Book Recommendations · Lucas's House</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
        color: #29314f;
        background: #fff8dc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 88% 14%, #81dec7 0 7%, transparent 7.2%),
          radial-gradient(circle at 9% 88%, #f3a5c4 0 9%, transparent 9.2%),
          linear-gradient(145deg, #fffdf3, #ffedac);
      }
      main { width: min(900px, 100%); margin: 0 auto; padding: 26px 0 50px; }
      .back { display: inline-block; margin-bottom: 42px; color: inherit; font-weight: 900; text-decoration: none; }
      .back:hover { text-decoration: underline; }
      .eyebrow { margin: 0 0 9px; color: #9b5f17; font-size: .8rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 0; font-size: clamp(2.8rem, 9vw, 6rem); line-height: .94; letter-spacing: -.055em; }
      .intro { max-width: 650px; margin: 20px 0 34px; color: #5e6176; font-size: 1.08rem; line-height: 1.55; }
      .bookshelf {
        position: relative;
        display: grid;
        min-height: 350px;
        padding: 44px 28px 66px;
        border: 4px solid #29314f;
        border-radius: 24px;
        background: #9c613a;
        box-shadow: 10px 11px 0 #29314f;
        place-items: end center;
      }
      .bookshelf::after { position: absolute; right: 20px; bottom: 48px; left: 20px; height: 22px; border: 4px solid #29314f; border-radius: 8px; background: #ca8753; content: ""; }
      .books { position: relative; z-index: 1; display: flex; align-items: end; justify-content: center; gap: 10px; }
      .book { width: clamp(42px, 9vw, 66px); border: 4px solid #29314f; border-radius: 8px 8px 3px 3px; box-shadow: inset -8px 0 #00000012; }
      .future-book:nth-child(2) { height: 175px; background: #f3a5c4; }
      .future-book:nth-child(3) { height: 205px; background: #aeb7f5; }
      .future-book:nth-child(4) { height: 155px; background: #ffd966; }
      .recommended-book {
        display: grid;
        width: clamp(150px, 28vw, 190px);
        height: 240px;
        padding: 20px 16px;
        border-color: #29314f;
        color: #fff;
        background: linear-gradient(150deg, #185b83, #29314f 70%);
        box-shadow: inset -12px 0 #0003, 7px 7px 0 #29314f;
        place-content: center;
        text-align: center;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }
      .recommended-book:hover { box-shadow: inset -12px 0 #0003, 10px 11px 0 #29314f; transform: translateY(-7px) rotate(-1deg); }
      .recommended-book:focus-visible { outline: 6px solid #fff; outline-offset: 5px; }
      .book-number { margin-bottom: 12px; color: #ffd966; font-size: .68rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
      .recommended-book strong { font-size: clamp(1rem, 3vw, 1.3rem); line-height: 1.2; }
      .open-book { margin-top: 16px; color: #b7f1e3; font-size: .78rem; font-weight: 900; }
      .shelf-note { position: relative; z-index: 1; margin: 26px 0 0; padding: 13px 18px; border: 3px solid #29314f; border-radius: 999px; background: #fff; font-weight: 900; text-align: center; }
      @media (max-width: 560px) {
        body { padding: 16px; }
        .bookshelf { min-height: 310px; padding-inline: 18px; box-shadow: 7px 8px 0 #29314f; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Back to Lucas's house</a>
      <p class="eyebrow">A room full of stories</p>
      <h1>Book Recommendations</h1>
      <p class="intro">Welcome to Lucas's reading room. This is where Lucas will share books he enjoyed and thinks other readers might like too.</p>
      <section class="bookshelf" aria-label="Lucas's recommendation bookshelf">
        <div class="books">
          <a class="book recommended-book" href="harry-potter-goblet-of-fire/">
            <span class="book-number">Lucas's Pick #1</span>
            <strong>Harry Potter and the Goblet of Fire</strong>
            <span class="open-book">Open book →</span>
          </a>
          <span class="book future-book" aria-hidden="true"></span>
          <span class="book future-book" aria-hidden="true"></span>
          <span class="book future-book" aria-hidden="true"></span>
        </div>
        <p class="shelf-note">Choose a book from Lucas's shelf. 📖</p>
      </section>
    </main>
  </body>
</html>
