<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8e7">
    <title>Lucas's Homepage</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
        color: #18324a;
        background: #fff8e7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 18%, #ffe279 0 8%, transparent 8.2%),
          radial-gradient(circle at 88% 82%, #8fe3d3 0 12%, transparent 12.2%),
          linear-gradient(145deg, #fffdf5, #fff0ca);
      }

      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(72px, 12vw, 140px) 0 64px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #ee704a;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(2.8rem, 8vw, 6.4rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 560px;
        margin: 24px 0 0;
        color: #536779;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.6;
      }

      footer {
        margin-top: 54px;
        color: #6b7985;
        font-size: 0.9rem;
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 28px, 960px);
          padding-top: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Welcome</p>
      <h1>Lucas's Homepage</h1>
      <p class="intro">A little corner of the internet for Lucas's projects and creative experiments.</p>

      <footer>Made by Lucas.</footer>
    </main>
  </body>
</html>
